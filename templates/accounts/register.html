{% extends 'base.html' %}

{% block title %}Register - UPBS Campus Safety{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 2rem auto;">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">📝 Campus User Registration</h2>
            <span style="font-size: 0.85rem; color: var(--text-muted);">Step 1 of 2</span>
        </div>

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="full_name">Full Names</label>
                <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Rethabile Pheko" required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="institutional_id">Student / Staff ID</label>
                    <input type="text" id="institutional_id" name="institutional_id" class="form-control" placeholder="e.g. 202411369" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="role">Role</label>
                    <select id="role" name="role" class="form-control" required>
                        <option value="STUDENT">Student</option>
                        <option value="STAFF">Staff Member</option>
                        <option value="SECURITY">Campus Security</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="email">Institutional Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@campus.ac.za" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="contact_number">Mobile Contact</label>
                    <input type="tel" id="contact_number" name="contact_number" class="form-control" placeholder="+27 71 000 0000" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="password">Create Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password_confirm">Confirm Password</label>
                    <input type="password" id="password_confirm" name="password_confirm" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-save-green" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 1.05rem; margin-top: 1rem;">
                Proceed to Identity Verification (OTP)
            </button>
        </form>

        <div style="margin-top: 1.25rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? <a href="{% url 'login' %}" style="color: #60a5fa; text-decoration: none;">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
