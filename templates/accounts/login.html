{% extends 'base.html' %}

{% block title %}Login - UPBS Campus Safety{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
    <div class="card">
        <div class="card-header" style="text-align: center; display: block;">
            <h2 class="card-title" style="justify-content: center; font-size: 1.5rem;">
                🚨 Student & Staff Access
            </h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.3rem;">
                University Panic Button System (UPBS)
            </p>
        </div>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="username">Institutional ID / Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="e.g. 202474004 or student1" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1.05rem; margin-top: 0.5rem;">
                Sign In to Safety Portal
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account yet? 
            <a href="{% url 'register' %}" style="color: #60a5fa; font-weight: 600; text-decoration: none;">Register Now</a>
        </div>
    </div>

    <!-- Quick Demo Access Helper for Examiners / Testing -->
    <div class="card" style="background: rgba(15, 23, 42, 0.5); border: 1px dashed rgba(255, 255, 255, 0.2);">
        <h4 style="font-size: 0.95rem; margin-bottom: 0.75rem; color: #fbbf24;">⚡ Examiner & Demo Quick Login</h4>
        <div style="display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.85rem;">
            <button type="button" class="btn btn-outline" style="text-align: left; justify-content: flex-start;" onclick="fillLogin('student1', 'password123')">
                👤 <strong>Student:</strong> student1 (Brown Nkosi - 202474004) / password123
            </button>
            <button type="button" class="btn btn-outline" style="text-align: left; justify-content: flex-start;" onclick="fillLogin('officer1', 'password123')">
                🛡️ <strong>Security Officer:</strong> officer1 (Sgt. Thabo Dlamini) / password123
            </button>
            <button type="button" class="btn btn-outline" style="text-align: left; justify-content: flex-start;" onclick="fillLogin('admin', 'password123')">
                ⚙️ <strong>Administrator:</strong> admin / password123
            </button>
        </div>
    </div>
</div>

<script>
function fillLogin(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
}
</script>
{% endblock %}
